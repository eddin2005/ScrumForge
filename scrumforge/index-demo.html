<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="dark"/>
<title>ScrumForge — Agile Delivery Platform</title>
<style>
:root{
  --bg:#f7f8fa; --pan:#ffffff; --pan2:#f8fafc;
  --line:#e4e7ec; --line2:#cbd2dc;
  --cy:#2563eb; --gr:#059669; --am:#d97706; --rd:#dc2626; --vi:#7c3aed; --bl:#0891b2;
  --tx:#1f2937; --dim:#64748b; --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);
  color:var(--tx);font:13px/1.5 'Segoe UI',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(15,23,42,.22);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:#ffffff;border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
canvas.chart{width:100%;display:block}
h3.sec{font-size:10px;letter-spacing:1.8px;color:var(--dim);text-transform:uppercase;margin:18px 0 9px;
  display:flex;align-items:center;gap:8px}
h3.sec::after{content:'';flex:1;height:1px;background:var(--line)}
h3.sec:first-child{margin-top:2px}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:216px;position:fixed;top:0;bottom:0;left:0;background:var(--pan);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;backdrop-filter:blur(10px)}
#logo{padding:16px 16px 13px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#logo .mark{width:34px;height:34px;border-radius:9px;background:#eef2ff;
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:17px}
#logo b{font-size:15px;letter-spacing:1px;display:block}
#logo b i{color:var(--cy);font-style:normal}
#logo small{font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;display:block}
#nav{flex:1;padding:10px 8px;overflow-y:auto}
.navitem{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--dim);
  font-size:12.5px;margin-bottom:2px;border:1px solid transparent;text-align:left}
.navitem:hover{color:var(--tx);background:rgba(37,99,235,.06)}
.navitem.on{color:var(--cy);background:rgba(37,99,235,.1);border-color:rgba(37,99,235,.25)}
.navitem .ic{width:20px;text-align:center;font-size:14px}
#sideFoot{padding:12px;border-top:1px solid var(--line)}
#sprintChip{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#sprintChip b{color:var(--cy);font-size:12px;display:block}
#sprintChip .row{display:flex;justify-content:space-between;margin-top:3px}
#btnReset{width:100%;margin-top:9px;padding:7px;border:1px solid rgba(220,38,38,.35);border-radius:8px;
  color:var(--rd);font-size:11px;background:rgba(220,38,38,.06)}
#btnReset:hover{background:rgba(220,38,38,.14)}

#main{flex:1;margin-left:216px;padding:18px 22px 60px;min-width:0}
#vhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
#vTitle{font-size:21px;font-weight:700;letter-spacing:.4px}
#vSub{color:var(--dim);font-size:12px;margin-top:2px}
#vActs{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.abtn{padding:7px 13px;border:1px solid var(--line);border-radius:9px;background:var(--pan2);color:var(--tx);
  font-size:12px;display:inline-flex;align-items:center;gap:7px}
.abtn:hover{border-color:var(--line2);background:rgba(37,99,235,.08)}
.abtn.pri{border-color:rgba(37,99,235,.5);color:var(--cy);background:rgba(37,99,235,.1)}
.abtn.dng{border-color:rgba(220,38,38,.4);color:var(--rd)}
.abtn:disabled{opacity:.4;cursor:not-allowed}
.pane{display:none;animation:pin .25s}
.pane.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}

/* ---------- cards & kpis ---------- */
.card{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.card .ct{font-size:10px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .ct b{color:var(--tx);font-family:var(--mono);font-size:11px;font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:11px 13px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--cy);opacity:.75}
.kpi.g::before{background:var(--gr)}.kpi.a::before{background:var(--am)}.kpi.r::before{background:var(--rd)}.kpi.v::before{background:var(--vi)}.kpi.b::before{background:var(--bl)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600}
.kpi .v small{font-size:10px;color:var(--dim)}
.kpi .l{font-size:9.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr}}

/* ---------- tags / chips / avatars ---------- */
.tag{display:inline-block;padding:2px 8px;border-radius:9px;font-size:9.5px;font-family:var(--mono);letter-spacing:.3px}
.tag.c{background:rgba(37,99,235,.14);color:var(--cy)}
.tag.g{background:rgba(5,150,105,.14);color:var(--gr)}
.tag.a{background:rgba(217,119,6,.14);color:var(--am)}
.tag.r{background:rgba(220,38,38,.14);color:var(--rd)}
.tag.v{background:rgba(124,58,237,.14);color:var(--vi)}
.tag.b{background:rgba(96,165,250,.14);color:var(--bl)}
.tag.d{background:rgba(100,116,139,.14);color:var(--dim)}
.ava{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#ffffff;font-family:var(--mono);flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.dotp{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- tables ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:11.5px}
.tb th{text-align:left;color:var(--dim);font-weight:500;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;
  padding:5px 6px;border-bottom:1px solid var(--line)}
.tb td{padding:7px 6px;border-bottom:1px solid rgba(15,23,42,.07);font-family:var(--mono);font-size:10.5px;vertical-align:middle}
.tb td.t{font-family:inherit;font-size:12px}
.tb tr:hover td{background:rgba(37,99,235,.04)}
.tb .rt{text-align:right}

/* ---------- backlog ---------- */
#bkTools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
#bkTools input[type=search]{flex:1;min-width:180px}
#bkTools select{max-width:170px}
.epic{margin-bottom:12px}
.epicHead{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--pan2);
  border:1px solid var(--line);border-radius:10px 10px 0 0;font-size:12px;flex-wrap:wrap}
.epicHead b{letter-spacing:.4px}
.epicHead .meta{color:var(--dim);font-family:var(--mono);font-size:10px}
.epicHead .bar{flex:1;height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden;min-width:90px;max-width:180px}
.epicHead .bar i{display:block;height:100%;background:var(--cy)}
.storyRow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pan);
  border:1px solid var(--line);border-top:none}
.storyRow:last-child{border-radius:0 0 10px 10px}
.storyRow:hover{background:rgba(37,99,235,.05)}
.storyRow .sid{font-family:var(--mono);font-size:10px;color:var(--dim);width:58px;flex:none}
.storyRow .st{flex:1;min-width:0;font-size:12.5px;cursor:pointer}
.storyRow .st:hover{color:var(--cy)}
.storyRow .pts{font-family:var(--mono);font-size:11px;color:var(--vi);background:rgba(124,58,237,.12);
  padding:2px 8px;border-radius:9px;flex:none}
.storyRow .mv{display:flex;gap:2px}
.mbtn{padding:3px 7px;border:1px solid var(--line);border-radius:6px;color:var(--dim);font-size:10px}
.mbtn:hover{color:var(--cy);border-color:var(--line2)}

/* ---------- board ---------- */
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
@media(max-width:1250px){#board{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){#board{grid-template-columns:1fr 1fr}}
.bcol{background:var(--pan);border:1px solid var(--line);border-radius:12px;min-height:340px;display:flex;flex-direction:column;transition:border-color .15s, box-shadow .15s}
.bcol.over{border-color:var(--cy);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.bcolH{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.bcolH .nm{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.bcolH .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.bcolH .wip{font-family:var(--mono);font-size:9px;padding:1px 7px;border-radius:8px;background:rgba(100,116,139,.15);color:var(--dim)}
.bcolH .wip.hot{background:rgba(220,38,38,.18);color:var(--rd)}
.bcolBody{padding:9px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:120px}
.bcard{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:grab;transition:transform .12s,border-color .12s}
.bcard:hover{border-color:var(--line2);transform:translateY(-1px)}
.bcard.dragging{opacity:.45;cursor:grabbing}
.bcard .bid{font-family:var(--mono);font-size:9px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:4px}
.bcard .bt{font-size:12px;line-height:1.35;margin-bottom:8px;cursor:pointer}
.bcard .bt:hover{color:var(--cy)}
.bcard .bmeta{display:flex;align-items:center;gap:7px}
.bcard .pts{font-family:var(--mono);font-size:10px;color:var(--vi);background:rgba(124,58,237,.12);padding:1px 7px;border-radius:8px}
.bcard .ep{font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .ava{margin-left:auto;width:20px;height:20px;font-size:8px}
.bcolAdd{padding:8px;color:var(--dim);font-size:11px;border-top:1px dashed var(--line);text-align:center}
.bcolAdd:hover{color:var(--cy)}

/* ---------- sprints ---------- */
.spGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.spCard{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:13px 15px;position:relative;overflow:hidden}
.spCard.active{border-color:rgba(5,150,105,.5);box-shadow:0 0 24px rgba(5,150,105,.07)}
.spCard.planned{border-style:dashed}
.spTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.spName{font-weight:700;font-size:14px}
.spGoal{color:var(--dim);font-size:11.5px;margin-bottom:10px;min-height:32px}
.spMeta{display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:9px;flex-wrap:wrap}
.pbar{height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--cy);transition:width .5s}
.spFoot{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.spFoot .abtn{padding:5px 10px;font-size:11px}

/* ---------- team ---------- */
.tGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tCard{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tTop{display:flex;gap:11px;align-items:center}
.tAva{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--mono);font-size:13px;color:#ffffff;flex:none}
.tName{font-weight:700;font-size:13.5px}
.tRole{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.wl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12px}
.chk .bx{width:15px;height:15px;border-radius:4px;border:1px solid var(--line2);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--gr)}
.chk.done .bx{background:rgba(5,150,105,.15);border-color:var(--gr)}

/* ---------- ceremonies ---------- */
.feed{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.fitem{display:flex;gap:9px;align-items:flex-start;background:var(--pan2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.fitem .t{font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap;margin-top:2px;min-width:86px}
.fitem .m{font-size:12px;line-height:1.4}
.retroG{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:1000px){.retroG{grid-template-columns:1fr}}
.retroCol{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:11px}
.retroCol h4{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.retroCol ul{list-style:none}
.retroCol li{font-size:12px;padding:4px 0 4px 16px;position:relative;border-bottom:1px solid rgba(15,23,42,.06)}
.retroCol li::before{content:'\25B8';position:absolute;left:2px;color:var(--dim)}
.rw h4{color:var(--gr)} .ri h4{color:var(--am)} .ra h4{color:var(--cy)}

/* ---------- timeline (about) ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:#d1d5db}
.tlItem{position:relative;padding:0 0 16px 8px}
.tlItem::before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--bg);border:2px solid var(--cy)}
.tlItem.past::before{background:var(--cy)}
.tlItem .tlD{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.tlItem .tlT{font-weight:700;font-size:13px;margin:1px 0}
.tlItem .tlM{color:var(--dim);font-size:11.5px}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;
  background:rgba(17,24,39,.45);backdrop-filter:blur(4px);overflow-y:auto;padding:60px 16px}
#modalRoot.on{display:flex}
.modal{background:#ffffff;border:1px solid var(--line2);border-radius:14px;width:560px;max-width:100%;
  box-shadow:0 20px 70px rgba(0,0,0,.14);animation:mup .22s}
@keyframes mup{from{opacity:0;transform:translateY(14px)}}
.mHead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mHead b{font-size:15px}
.mHead .x{margin-left:auto;color:var(--dim);font-size:16px;padding:2px 8px;border-radius:7px}
.mHead .x:hover{color:var(--rd);background:rgba(220,38,38,.1)}
.mBody{padding:16px 18px;max-height:65vh;overflow-y:auto}
.mFoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.frow.one{grid-template-columns:1fr}
.fld label{display:block;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%}
.fld textarea{min-height:74px;resize:vertical;font-family:var(--mono);font-size:11.5px}

/* ---------- print / PDF sprint report ---------- */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#111}
  #app,#toasts,#loader,#modalRoot{display:none!important}
  #printRoot{display:block;font:12px/1.55 Georgia,'Times New Roman',serif;color:#111}
  #printRoot h1{font-size:20px;margin:0 0 2px}
  .rp-head{display:flex;gap:12px;align-items:center;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:14px}
  .rp-brand{font:700 13px/1 Verdana,sans-serif;letter-spacing:2px;border:2px solid #111;padding:6px 8px;border-radius:6px;white-space:nowrap}
  .rp-sub{color:#444;font-size:11px}
  .rp-card{margin-bottom:16px;page-break-inside:avoid}
  .rp-card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #999;padding-bottom:3px;margin:0 0 8px;font-family:Verdana,sans-serif}
  .rp-card h3{font-size:11px;margin:10px 0 4px;font-family:Verdana,sans-serif}
  table.rp-tb{width:100%;border-collapse:collapse;font-size:10.5px;font-family:Verdana,sans-serif}
  table.rp-tb th{background:#eee;border:1px solid #999;padding:4px 6px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
  table.rp-tb td{border:1px solid #aaa;padding:4px 6px}
  table.rp-kv{width:100%;border-collapse:collapse;font-size:11px}
  table.rp-kv th{width:150px;text-align:left;padding:3px 6px;background:#f2f2f2;border:1px solid #aaa;vertical-align:top;font-size:10px;text-transform:uppercase}
  table.rp-kv td{border:1px solid #aaa;padding:3px 6px}
  .rp-goal{margin:0 0 6px}
  .rp-img{width:100%;max-width:720px;border:1px solid #bbb;border-radius:6px;margin-top:4px}
  .rp-ul{margin:0;padding-left:18px}
  .rp-ul li{margin:2px 0}
  .mut{color:#666;font-style:italic}
  .rp-foot{margin-top:18px;border-top:1px solid #999;padding-top:6px;color:#555;font-size:10px}
}

/* ---------- top bar (workspaces & account) ---------- */
#wsBar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:45}
#wsBar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:1px;white-space:nowrap}
#wsBar .brand i{color:var(--cy);font-style:normal}
#wsSel,#prjSel{max-width:190px;padding:4px 8px;font-size:11.5px}
#wbMid{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.netbadge{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:9px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.netbadge.cloud{color:var(--gr);border-color:rgba(5,150,105,.4);background:rgba(5,150,105,.08)}
.netbadge.local{color:var(--am);border-color:rgba(217,119,6,.4);background:rgba(217,119,6,.07)}
#wsBar .grow{flex:1}
.acct{display:flex;align-items:center;gap:8px;white-space:nowrap}
.acct .who{font-size:11px;color:var(--dim)}
#app{padding-top:44px}
#side{top:44px}

/* ---------- auth screen ---------- */
#authScreen{position:fixed;inset:0;z-index:70;background:#f3f4f6;
  display:none;align-items:center;justify-content:center;padding:20px}
#authScreen.on{display:flex}
.authBox{width:840px;max-width:100%;display:grid;grid-template-columns:1.05fr 1fr;
  background:var(--pan2);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.12)}
.authL{padding:30px 28px;border-right:1px solid var(--line)}
.authL h1{font-size:22px;letter-spacing:1px}
.authL h1 b{color:var(--cy)}
.authL p{color:var(--dim);font-size:12px;margin-top:12px;line-height:1.6}
.authL .tag{margin:10px 6px 0 0}
.authR{padding:24px 22px;display:flex;flex-direction:column;gap:9px;max-height:80vh;overflow-y:auto}
.authR h3{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
.demoUser{display:flex;align-items:center;gap:11px;background:var(--pan);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;cursor:pointer;text-align:left;width:100%}
.demoUser:hover{border-color:var(--line2);background:rgba(37,99,235,.07)}

/* =====================================================================
   STATE
===================================================================== */

let DB=null;          /* dataset of the ACTIVE project */
let PRJDATA={};       /* per-project datasets: {projectId: dataset} */
function storeKey(){ return 'scrumforge.v2.projects'; }
function seedProject(){ const d=seedData(); d.stories=d.stories.concat(roadmapStories()); return d; }
function loadAll(){
  try{ const raw=localStorage.getItem(storeKey()); if(raw){ PRJDATA=JSON.parse(raw); } }catch(e){}
  PROJECTS.forEach(p=>{ if(!PRJDATA[p.id]) PRJDATA[p.id]=seedProject(); });
  DB=PRJDATA[PRJID];
  if(!DB){ DB=PRJDATA[PRJID]=seedProject(); }
  if(SB) cloudLoad();
}
function save(){ try{ localStorage.setItem(storeKey(), JSON.stringify(PRJDATA)); }catch(e){} if(SB) cloudSave(); }
function resetDemo(){
  PRJDATA[PRJID]=seedProject(); DB=PRJDATA[PRJID]; save();
  toast('Demo data restored to seed','g');
  renderAll();
}

/* =====================================================================
   PLATFORM LAYER — roles, auth screen, optional Supabase backend
===================================================================== */
let ME=null;   /* current user: {id,name,initials,color,role,email} */
let SB=null;   /* supabase-js client when configured */

const SUPABASE_URL='';   /* paste your Project URL, e.g. https://xyz.supabase.co */
const SUPABASE_ANON='';  /* paste your anon public key */

const ROLE_PERMS={
  owner:['edit','admin'], admin:['edit','admin'], scrum_master:['edit'],
  product_owner:['edit'], developer:['edit'], viewer:[]
};
function can(p){ return !!ME && (ROLE_PERMS[ME.role]||[]).includes(p); }

function loadSupabase(){
  if(!SUPABASE_URL||!SUPABASE_ANON) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload=()=>{
    try{
      SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
      SB.auth.getSession().then(({data})=>{ if(data&&data.session&&data.session.user&&!ME) cloudAdopt(data.session.user); });
      SB.auth.onAuthStateChange((evt,session)=>{
        if(evt==='SIGNED_IN'&&session&&session.user&&!ME) cloudAdopt(session.user);
        if(evt==='SIGNED_OUT'){ ME=null; location.reload(); }
      });
    }catch(e){ console.warn('Supabase init failed',e); }
  };
  document.head.appendChild(s);
}
function cloudAdopt(user){
  const meta=user.user_metadata||{};
  const seed=TEAM_SEED.find(t=>t.email===(user.email||'').toLowerCase());
  ME={ id:user.id, email:user.email, name:meta.name||(seed?seed.name:user.email.split('@')[0]),
       initials:String(meta.name||user.email).slice(0,2).toUpperCase(),
       color:seed?seed.color:'#0891b2', role:meta.role||'developer', cloud:true };
  loadAll(); bootAsUser(); renderAuthScreen();
  toast('Signed in as '+ME.name+' ('+roleLabel(ME.role)+')','g');
  SB.from('workspaces').select('id,name').limit(1).then(({data})=>{ if(data&&data[0]) ME.ws=data[0].id; });
}
async function cloudSignUp(email,pw,name,role){
  const {error}=await SB.auth.signUp({email,password:pw,options:{data:{name:name,role:role}}});
  if(error){ toast(error.message,'r'); return; }
  toast('Account created — confirm via email, then sign in','g');
}
async function cloudSignIn(email,pw){
  const {error}=await SB.auth.signInWithPassword({email,password:pw});
  if(error) toast(error.message,'r');
}
function cloudSave(){
  if(!SB||!DB||!ME) return;
  const prj=PRJ();
  SB.from('projects').upsert({ id:prj.id, workspace_id:ME.ws||null, name:prj.name, key:prj.key,
    description:prj.desc, template:prj.template, color:prj.color, data:PRJDATA, updated_by:ME.id })
    .then(({error})=>{ if(error) console.warn('cloudSave:',error.message); });
}
async function cloudLoad(){
  if(!SB) return;
  try{
    const {data}=await SB.from('projects').select('*').eq('id',PRJID).maybeSingle();
    if(data&&data.data&&Object.keys(data.data).length){ PRJDATA=data.data; DB=PRJDATA[PRJID]||seedProject(); }
  }catch(e){ console.warn('cloudLoad:',e); }
}
function subscribeRealtime(){
  if(!SB) return;
  try{
    SB.channel('prj-'+PRJID).on('postgres_changes',
      {event:'UPDATE',schema:'public',table:'projects',filter:'id=eq.'+PRJID},
      (payload)=>{ if(payload.new&&payload.new.updated_by!==ME.id){ PRJDATA=payload.new.data; DB=PRJDATA[PRJID]||DB; renderAll(); toast('Updated by a teammate','g'); } }
    ).subscribe();
  }catch(e){}
}
function touch(kind,detail){
  if(!DB) return;
  if(!DB.activity) DB.activity=[];
  DB.activity.push({kind:kind,detail:detail,who:ME?ME.name:'system',when:new Date().toLocaleString()});
  if(DB.activity.length>400) DB.activity=DB.activity.slice(-400);
}

function sprintLen(sp){ return Math.max(1, (d2t(sp.end)-d2t(sp.start))+1); }
function daysLeft(sp){ return Math.max(0, d2t(sp.end)-pinDayNum()+1); }
function dayIdx(sp){ return Math.min(Math.max(pinDayNum()-d2t(sp.start)+1,0), sprintLen(sp)); }

const doneSprints = () => DB.sprints.filter(s=>s.status==='done');
function sprintPoints(n){ return sprintStories(n).reduce((a,s)=>a+s.points,0); }
function donePoints(n){ return sprintStories(n).filter(s=>s.status==='done').reduce((a,s)=>a+s.points,0); }
function colPoints(n,st){ return sprintStories(n).filter(s=>s.status===st).reduce((a,s)=>a+s.points,0); }
function avgVelocity(){ const ds=doneSprints(); return ds.length? Math.round(ds.reduce((a,s)=>a+s.completed,0)/ds.length*10)/10 : 0; }
function committedOf(sp){ return sp.committed || sprintPoints(sp.n); }
function backlogOpenPoints(){ return DB.stories.filter(s=>!s.sprint || s.status!=='done').reduce((a,s)=>a+s.points,0); }

      '<span class="tt" data-id="'+esc(s.id)+'">'+esc(s.title)+'</span>'+
      '<span class="kids">'+s.points+' pts · '+colName(s.status)+(s.sprint?' · S'+s.sprint:'')+(kids.length?' · '+kids.length+' sub':'')+'</span>'+

}

/* =====================================================================
   CHARTS (canvas, no libraries)
===================================================================== */

function prepCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||600, h=cv.height;
  cv.width=w*dpr; cv.style.height=h+'px'; cv.height=h*dpr;
  const x=cv.getContext('2d'); x.scale(dpr,dpr);
  return {x,w,h};
}

function burnSeries(n){
  const sp=sprintByN(n); if(!sp) return [];
  const total=committedOf(sp), len=sprintLen(sp);
  const done=sprintStories(n).filter(s=>s.status==='done');
  const per=done.length?len/(done.length+1):0;
  const compDay=done.map((s,i)=>Math.max(1,Math.round((i+1)*per)));
  const today=sp.status==='active'?dayIdx(sp)-1:len-1;
  const out=[];
  for(let d=0; d<=Math.max(today,0); d++){
    let rem=total;
    compDay.forEach((cd,i)=>{ if(cd<=d) rem-=done[i].points; });
    out.push(Math.max(0,rem));
  }
  return out;
}

function velSeries(){
  return doneSprints().map(s=>({label:'S'+s.n, committed:committedOf(s), completed:s.completed}));
}

function lineChart(cv, series, opts){
  if(!cv) return;
  const {x,w,h}=prepCanvas(cv);
  const o=opts||{};
  x.clearRect(0,0,w,h);
  const pad={l:34,r:12,t:12,b:22};
  const data=series.slice();
  const idealLen=data.length;
  if(!data.length){ x.fillStyle='rgba(100,116,139,.5)'; x.font='11px monospace'; x.fillText('no data yet',pad.l,40); return; }
  const max=Math.max(1,...data);
  const X=i=>pad.l+(idealLen<=1?0:(w-pad.l-pad.r)*(i/(idealLen-1)));
  const Y=v=>h-pad.b-(h-pad.t-pad.b)*(v/max);
  x.strokeStyle='rgba(15,23,42,.14)'; x.fillStyle='rgba(100,116,139,.9)'; x.font='9px monospace';
  for(let g=0;g<=4;g++){
    const vy=pad.t+(h-pad.t-pad.b)*g/4;
    x.beginPath(); x.moveTo(pad.l,vy); x.lineTo(w-pad.r,vy); x.stroke();
    x.fillText(String(Math.round(max*(1-g/4))), 6, vy+3);
  }
  x.beginPath();
  for(let i=0;i<idealLen;i++){ const px=X(i),py=Y(max*(1-i/Math.max(idealLen-1,1))); i?x.lineTo(px,py):x.moveTo(px,py); }
  x.setLineDash([4,4]); x.strokeStyle='rgba(100,116,139,.6)'; x.stroke(); x.setLineDash([]);
  x.beginPath();
  data.forEach((v,i)=>{ i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)); });
  x.strokeStyle='#2563eb'; x.lineWidth=2; x.stroke();
  x.lineTo(X(data.length-1),h-pad.b); x.lineTo(X(0),h-pad.b); x.closePath();
  x.fillStyle='rgba(37,99,235,.08)'; x.fill();
  data.forEach((v,i)=>{ x.beginPath(); x.arc(X(i),Y(v),2.4,0,7); x.fillStyle='#2563eb'; x.fill(); });
  if(o.today!=null && o.today>=0 && o.today<idealLen){
    x.setLineDash([3,3]); x.strokeStyle='rgba(217,119,6,.7)';
    x.beginPath(); x.moveTo(X(o.today),pad.t); x.lineTo(X(o.today),h-pad.b); x.stroke(); x.setLineDash([]);
    x.fillStyle='#d97706'; x.font='9px monospace'; x.fillText('today', X(o.today)-14, pad.t+8);
  }
  x.fillStyle='rgba(100,116,139,.8)';
  for(let i=0;i<idealLen;i+=Math.ceil(idealLen/8)||1) x.fillText(String(i+1), X(i)-3, h-8);
}

function barChart(cv, groups){
  if(!cv) return;
  const {x,w,h}=prepCanvas(cv);
  x.clearRect(0,0,w,h);
  const pad={l:34,r:12,t:14,b:22};
  if(!groups.length){ x.fillStyle='rgba(100,116,139,.5)'; x.font='11px monospace'; x.fillText('no completed sprints yet',pad.l,40); return; }
  const max=Math.max(1,...groups.map(g=>Math.max(g.committed,g.completed)));
  const bw=(w-pad.l-pad.r)/groups.length;
  x.strokeStyle='rgba(15,23,42,.14)'; x.fillStyle='rgba(100,116,139,.9)'; x.font='9px monospace';
  for(let g=0;g<=4;g++){
    const vy=pad.t+(h-pad.t-pad.b)*g/4;
    x.beginPath(); x.moveTo(pad.l,vy); x.lineTo(w-pad.r,vy); x.stroke();
    x.fillText(String(Math.round(max*(1-g/4))), 6, vy+3);
  }
  groups.forEach((g,i)=>{
    const cx=pad.l+bw*i;
    const b1w=Math.min(16,bw*0.28);
    const h1=(h-pad.t-pad.b)*(g.committed/max);
    const h2=(h-pad.t-pad.b)*(g.completed/max);
    x.fillStyle='rgba(96,165,250,.55)'; x.fillRect(cx+bw*0.22-b1w, h-pad.b-h1, b1w, h1);
    x.fillStyle='#059669';             x.fillRect(cx+bw*0.55,     h-pad.b-h2, b1w, h2);
    x.fillStyle='rgba(100,116,139,.9)';
    x.fillText(g.label, cx+bw/2-8, h-8);
    if(g.completed>g.committed){} // (over-delivery would render same)
  });
  const avg=groups.reduce((a,g)=>a+g.completed,0)/groups.length;
  const ay=h-pad.b-(h-pad.t-pad.b)*(avg/max);
  x.setLineDash([4,4]); x.strokeStyle='rgba(5,150,105,.8)';
  x.beginPath(); x.moveTo(pad.l,ay); x.lineTo(w-pad.r,ay); x.stroke(); x.setLineDash([]);
  x.fillStyle='rgba(5,150,105,.95)'; x.fillText('avg '+avg.toFixed(1), w-58, ay-4);
}

function moveStory(id,dir){

function saveSprint(n){
  const name=$('#sName').value.trim(), goal=$('#sGoal').value.trim();
  const start=$('#sStart').value, end=$('#sEnd').value;
  if(!name||!start||!end){ toast('Name, start and end are required','a'); return; }
  if(d2t(end)<d2t(start)){ toast('End date must be after start','a'); return; }
  if(n){
    Object.assign(sprintByN(n),{name,goal,start,end});
    toast('Sprint updated','g');
  }else{
    const next=Math.max(0,...DB.sprints.map(s=>s.n))+1;
    DB.sprints.push({n:next,name,goal,start,end,status:'planned',committed:0,completed:0});
    toast('Sprint created — plan stories into it','g');
  }
  save(); closeModal(); renderAll();
}

function startSprint(n){
  if(!can('edit')){ toast('Only the team can start sprints','a'); return; }
  const sp=sprintByN(n); if(!sp) return;
  if(activeSprint()){ toast('Close the active sprint first','a'); return; }
  if(!sp.goal){ toast('A sprint goal is required to start','a'); return; }
  const pts=sprintPoints(n);
  if(!pts){ toast('Plan at least one story into this sprint','a'); return; }
  sp.status='active';
  sp.committed=pts;
  save(); renderAll();
  toast(sp.name+' started — '+pts+' pts committed 🚀','g');
}

function closeSprint(n){
  if(!can('edit')){ toast('Only the team can close sprints','a'); return; }
  const sp=sprintByN(n); if(!sp) return;
  const spilled=sprintStories(n).filter(s=>s.status!=='done');
  const spillPts=spilled.reduce((a,s)=>a+s.points,0);
  if(!confirm('Close '+sp.name+'?\n\nCompleted: '+donePoints(n)+' pts\nSpilled back to backlog: '+spilled.length+' stories ('+spillPts+' pts)\n\nSpilled stories return to the Product Backlog for re-planning.')) return;
  spilled.forEach(s=>{ s.sprint=null; });
  sp.status='done';
  sp.completed=donePoints(n);
  save(); renderAll();
  toast(sp.name+' closed · '+sp.completed+' pts delivered'+(spillPts?' · '+spillPts+' pts spilled':''),'g');
}

function deleteSprint(n){
  if(!can('edit')){ toast('Viewers cannot delete sprints','a'); return; }
  const sp=sprintByN(n); if(!sp) return;
  if(sp.status==='active'){ toast('Close the sprint before deleting','a'); return; }
  if(!confirm('Delete '+sp.name+'? Its stories return to the backlog.')) return;
  sprintStories(n).forEach(s=>{ s.sprint=null; });
  DB.sprints=DB.sprints.filter(s=>s.n!==n);
  save(); renderAll(); toast('Sprint deleted','r');
}

function csvCell(v){
  v=String(v==null?'':v);
  if(/[",\n\r]/.test(v)) v='"'+v.replace(/"/g,'""')+'"';
  return v;
}

function exportCSV(){
  const L=[];
  L.push('SPRINT SUMMARY');
  L.push(['Sprint','Name','Status','Start','End','Committed','Completed','Spilled','Success %'].map(csvCell).join(','));
  DB.sprints.forEach(sp=>{
    const c=committedOf(sp), d=sp.status==='done'?sp.completed:donePoints(sp.n);
    L.push([sp.n,sp.name,sp.status,sp.start,sp.end,c,d,c-d,(c?Math.round(d/c*100):0)+'%'].map(csvCell).join(','));
  });
  L.push('');
  L.push('STORIES');
  L.push(['ID','Title','Epic','Points','Priority','Assignee','Status','Sprint'].map(csvCell).join(','));
  DB.stories.forEach(s=>{
    L.push([s.id,s.title,epicById(s.epic).name,s.points,s.priority,userById(s.assignee).name,colName(s.status),s.sprint?('S'+s.sprint):''].map(csvCell).join(','));
  });
  const blob=new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='scrumforge-report-'+(DB.pinDay||todayISO())+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('CSV report downloaded','g');
}

/* Renders a chart into an offscreen canvas and returns a PNG data-URL
   (images print reliably; raw canvases often do not). */
function chartImage(w,h,drawFn){
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-9999px;top:0;width:'+w+'px;';
  const cv=document.createElement('canvas');
  cv.height=h; cv.style.width=w+'px';
  host.appendChild(cv); document.body.appendChild(host);
  const x=cv.getContext('2d');
  x.fillStyle='#0b1526'; x.fillRect(0,0,w,h);
  drawFn(cv);
  const url=cv.toDataURL('image/png');
  host.remove();
  return url;
}

    (stories.length
      ? '<table class="rp-tb"><tr><th>ID</th><th>Story</th><th>Epic</th><th>Pts</th><th>Assignee</th><th>Status</th></tr>'+
        stories.map(s=>'<tr><td>'+esc(s.id)+'</td><td>'+esc(s.title)+'</td><td>'+esc(epicById(s.epic).name)+'</td><td>'+s.points+'</td><td>'+esc(userById(s.assignee).name)+'</td><td>'+colName(s.status)+'</td></tr>').join('')+'</table>'
      : '<p class="mut">No stories planned in this sprint.</p>')+
    '<h3>Sprint burndown (ideal vs remaining)</h3><img class="rp-img" src="'+burnImg+'" alt="Sprint burndown chart">'+
    '</div>'+

    '<div class="rp-card"><h2>4 · Velocity across sprints</h2><img class="rp-img" src="'+velImg+'" alt="Velocity chart"></div>'+

    '<div class="rp-card"><h2>5 · Ceremonies — '+esc(sp.name)+'</h2><table class="rp-tb">'+
    '<tr><th>Day</th><th>Event</th><th>Notes</th></tr>'+cer+'</table></div>'+

    '<div class="rp-card"><h2>6 · Definition of Done</h2><ul class="rp-ul">'+DoD.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'+

    '<div class="rp-foot">Generated by ScrumForge v1.1 — Scrum applied to its own development · single-file app, no dependencies.</div>';
}

function printReport(){
  const sel=$('#repSprint');
  const n=sel?+sel.value:(activeSprint()||doneSprints().slice(-1)[0]||DB.sprints[0]).n;
  $('#printRoot').innerHTML=buildReportHTML(n);
  toast('Opening print dialog — choose Save as PDF','g');
  setTimeout(()=>window.print(),150);
}
window.addEventListener('afterprint',()=>{ const r=$('#printRoot'); if(r) r.innerHTML=''; });

/* =====================================================================
   BOOT
===================================================================== */

function init(){
  /* auth screen first — nothing renders behind it until a user exists */
  loadSupabase();
  renderAuthScreen();
  buildNav();
  $('#modalRoot').addEventListener('click',e=>{ if(e.target.id==='modalRoot') closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

  const steps=[
    ['loading seed dataset…',18],['mounting views…',38],['computing burndown…',58],
    ['crunching velocity…',76],['orchestrating scrum…',92],['ready',100]
  ];
  const log=$('#ldLog'), bar=$('#ldBar');
  steps.forEach((s,i)=>setTimeout(()=>{
    log.innerHTML+='<div class="ok">✓ '+s[0]+'</div>';
    bar.style.width=s[1]+'%';
    if(i===steps.length-1) setTimeout(()=>$('#loader').classList.add('done'),350);
  },120+i*160));

  window.addEventListener('resize',()=>{ if(VIEW==='dash'||VIEW==='reports') renderAll(); });
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
