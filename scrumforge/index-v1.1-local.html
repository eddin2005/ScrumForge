<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="dark"/>
<title>ScrumForge — Scrum Delivery Platform</title>
<style>
:root{
  --bg:#050a13; --pan:rgba(9,17,31,.88); --pan2:rgba(13,24,42,.94);
  --line:rgba(56,189,248,.16); --line2:rgba(56,189,248,.34);
  --cy:#22d3ee; --gr:#34d399; --am:#fbbf24; --rd:#f87171; --vi:#a78bfa; --bl:#60a5fa;
  --tx:#dfe9ff; --dim:#7e93b6; --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1100px 700px at 80% -10%,rgba(34,211,238,.07),transparent 60%),var(--bg);
  color:var(--tx);font:13px/1.5 'Segoe UI',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.22);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:#0b1728;border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(34,211,238,.08)}
canvas.chart{width:100%;display:block}
h3.sec{font-size:10px;letter-spacing:1.8px;color:var(--dim);text-transform:uppercase;margin:18px 0 9px;
  display:flex;align-items:center;gap:8px}
h3.sec::after{content:'';flex:1;height:1px;background:var(--line)}
h3.sec:first-child{margin-top:2px}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:216px;position:fixed;top:0;bottom:0;left:0;background:var(--pan);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;backdrop-filter:blur(10px)}
#logo{padding:16px 16px 13px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(167,139,250,.25));
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:17px}
#logo b{font-size:15px;letter-spacing:1px;display:block}
#logo b i{color:var(--cy);font-style:normal}
#logo small{font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;display:block}
#nav{flex:1;padding:10px 8px;overflow-y:auto}
.navitem{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--dim);
  font-size:12.5px;margin-bottom:2px;border:1px solid transparent;text-align:left}
.navitem:hover{color:var(--tx);background:rgba(34,211,238,.06)}
.navitem.on{color:var(--cy);background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.25)}
.navitem .ic{width:20px;text-align:center;font-size:14px}
#sideFoot{padding:12px;border-top:1px solid var(--line)}
#sprintChip{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#sprintChip b{color:var(--cy);font-size:12px;display:block}
#sprintChip .row{display:flex;justify-content:space-between;margin-top:3px}
#btnReset{width:100%;margin-top:9px;padding:7px;border:1px solid rgba(248,113,113,.35);border-radius:8px;
  color:var(--rd);font-size:11px;background:rgba(248,113,113,.06)}
#btnReset:hover{background:rgba(248,113,113,.14)}

#main{flex:1;margin-left:216px;padding:18px 22px 60px;min-width:0}
#vhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
#vTitle{font-size:21px;font-weight:700;letter-spacing:.4px}
#vSub{color:var(--dim);font-size:12px;margin-top:2px}
#vActs{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.abtn{padding:7px 13px;border:1px solid var(--line);border-radius:9px;background:var(--pan2);color:var(--tx);
  font-size:12px;display:inline-flex;align-items:center;gap:7px}
.abtn:hover{border-color:var(--line2);background:rgba(34,211,238,.08)}
.abtn.pri{border-color:rgba(34,211,238,.5);color:var(--cy);background:rgba(34,211,238,.1)}
.abtn.dng{border-color:rgba(248,113,113,.4);color:var(--rd)}
.abtn:disabled{opacity:.4;cursor:not-allowed}
.pane{display:none;animation:pin .25s}
.pane.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}

/* ---------- cards & kpis ---------- */
.card{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.card .ct{font-size:10px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .ct b{color:var(--tx);font-family:var(--mono);font-size:11px;font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:11px 13px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--cy);opacity:.75}
.kpi.g::before{background:var(--gr)}.kpi.a::before{background:var(--am)}.kpi.r::before{background:var(--rd)}.kpi.v::before{background:var(--vi)}.kpi.b::before{background:var(--bl)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600}
.kpi .v small{font-size:10px;color:var(--dim)}
.kpi .l{font-size:9.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr}}

/* ---------- tags / chips / avatars ---------- */
.tag{display:inline-block;padding:2px 8px;border-radius:9px;font-size:9.5px;font-family:var(--mono);letter-spacing:.3px}
.tag.c{background:rgba(34,211,238,.14);color:var(--cy)}
.tag.g{background:rgba(52,211,153,.14);color:var(--gr)}
.tag.a{background:rgba(251,191,36,.14);color:var(--am)}
.tag.r{background:rgba(248,113,113,.14);color:var(--rd)}
.tag.v{background:rgba(167,139,250,.14);color:var(--vi)}
.tag.b{background:rgba(96,165,250,.14);color:var(--bl)}
.tag.d{background:rgba(126,147,182,.14);color:var(--dim)}
.ava{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#04121c;font-family:var(--mono);flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.dotp{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- tables ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:11.5px}
.tb th{text-align:left;color:var(--dim);font-weight:500;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;
  padding:5px 6px;border-bottom:1px solid var(--line)}
.tb td{padding:7px 6px;border-bottom:1px solid rgba(56,189,248,.07);font-family:var(--mono);font-size:10.5px;vertical-align:middle}
.tb td.t{font-family:inherit;font-size:12px}
.tb tr:hover td{background:rgba(34,211,238,.04)}
.tb .rt{text-align:right}

/* ---------- backlog ---------- */
#bkTools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
#bkTools input[type=search]{flex:1;min-width:180px}
#bkTools select{max-width:170px}
.epic{margin-bottom:12px}
.epicHead{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--pan2);
  border:1px solid var(--line);border-radius:10px 10px 0 0;font-size:12px;flex-wrap:wrap}
.epicHead b{letter-spacing:.4px}
.epicHead .meta{color:var(--dim);font-family:var(--mono);font-size:10px}
.epicHead .bar{flex:1;height:4px;background:#12233c;border-radius:2px;overflow:hidden;min-width:90px;max-width:180px}
.epicHead .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr))}
.storyRow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pan);
  border:1px solid var(--line);border-top:none}
.storyRow:last-child{border-radius:0 0 10px 10px}
.storyRow:hover{background:rgba(34,211,238,.05)}
.storyRow .sid{font-family:var(--mono);font-size:10px;color:var(--dim);width:58px;flex:none}
.storyRow .st{flex:1;min-width:0;font-size:12.5px;cursor:pointer}
.storyRow .st:hover{color:var(--cy)}
.storyRow .pts{font-family:var(--mono);font-size:11px;color:var(--vi);background:rgba(167,139,250,.12);
  padding:2px 8px;border-radius:9px;flex:none}
.storyRow .mv{display:flex;gap:2px}
.mbtn{padding:3px 7px;border:1px solid var(--line);border-radius:6px;color:var(--dim);font-size:10px}
.mbtn:hover{color:var(--cy);border-color:var(--line2)}

/* ---------- board ---------- */
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
@media(max-width:1250px){#board{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){#board{grid-template-columns:1fr 1fr}}
.bcol{background:var(--pan);border:1px solid var(--line);border-radius:12px;min-height:340px;display:flex;flex-direction:column;transition:border-color .15s, box-shadow .15s}
.bcol.over{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.bcolH{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.bcolH .nm{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.bcolH .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.bcolH .wip{font-family:var(--mono);font-size:9px;padding:1px 7px;border-radius:8px;background:rgba(126,147,182,.15);color:var(--dim)}
.bcolH .wip.hot{background:rgba(248,113,113,.18);color:var(--rd)}
.bcolBody{padding:9px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:120px}
.bcard{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:grab;transition:transform .12s,border-color .12s}
.bcard:hover{border-color:var(--line2);transform:translateY(-1px)}
.bcard.dragging{opacity:.45;cursor:grabbing}
.bcard .bid{font-family:var(--mono);font-size:9px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:4px}
.bcard .bt{font-size:12px;line-height:1.35;margin-bottom:8px;cursor:pointer}
.bcard .bt:hover{color:var(--cy)}
.bcard .bmeta{display:flex;align-items:center;gap:7px}
.bcard .pts{font-family:var(--mono);font-size:10px;color:var(--vi);background:rgba(167,139,250,.12);padding:1px 7px;border-radius:8px}
.bcard .ep{font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .ava{margin-left:auto;width:20px;height:20px;font-size:8px}
.bcolAdd{padding:8px;color:var(--dim);font-size:11px;border-top:1px dashed var(--line);text-align:center}
.bcolAdd:hover{color:var(--cy)}

/* ---------- sprints ---------- */
.spGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.spCard{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:13px 15px;position:relative;overflow:hidden}
.spCard.active{border-color:rgba(52,211,153,.5);box-shadow:0 0 24px rgba(52,211,153,.07)}
.spCard.planned{border-style:dashed}
.spTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.spName{font-weight:700;font-size:14px}
.spGoal{color:var(--dim);font-size:11.5px;margin-bottom:10px;min-height:32px}
.spMeta{display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:9px;flex-wrap:wrap}
.pbar{height:5px;background:#12233c;border-radius:3px;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr));transition:width .5s}
.spFoot{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.spFoot .abtn{padding:5px 10px;font-size:11px}

/* ---------- team ---------- */
.tGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tCard{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tTop{display:flex;gap:11px;align-items:center}
.tAva{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--mono);font-size:13px;color:#04121c;flex:none}
.tName{font-weight:700;font-size:13.5px}
.tRole{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.wl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12px}
.chk .bx{width:15px;height:15px;border-radius:4px;border:1px solid var(--line2);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--gr)}
.chk.done .bx{background:rgba(52,211,153,.15);border-color:var(--gr)}

/* ---------- ceremonies ---------- */
.feed{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.fitem{display:flex;gap:9px;align-items:flex-start;background:var(--pan2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.fitem .t{font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap;margin-top:2px;min-width:86px}
.fitem .m{font-size:12px;line-height:1.4}
.retroG{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:1000px){.retroG{grid-template-columns:1fr}}
.retroCol{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:11px}
.retroCol h4{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.retroCol ul{list-style:none}
.retroCol li{font-size:12px;padding:4px 0 4px 16px;position:relative;border-bottom:1px solid rgba(56,189,248,.06)}
.retroCol li::before{content:'\25B8';position:absolute;left:2px;color:var(--dim)}
.rw h4{color:var(--gr)} .ri h4{color:var(--am)} .ra h4{color:var(--cy)}

/* ---------- timeline (about) ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--cy),var(--vi))}
.tlItem{position:relative;padding:0 0 16px 8px}
.tlItem::before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--bg);border:2px solid var(--cy);box-shadow:0 0 8px rgba(34,211,238,.5)}
.tlItem.past::before{background:var(--cy)}
.tlItem .tlD{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.tlItem .tlT{font-weight:700;font-size:13px;margin:1px 0}
.tlItem .tlM{color:var(--dim);font-size:11.5px}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;
  background:rgba(3,8,16,.72);backdrop-filter:blur(4px);overflow-y:auto;padding:60px 16px}
#modalRoot.on{display:flex}
.modal{background:#0a1526;border:1px solid var(--line2);border-radius:14px;width:560px;max-width:100%;
  box-shadow:0 20px 70px rgba(0,0,0,.6);animation:mup .22s}
@keyframes mup{from{opacity:0;transform:translateY(14px)}}
.mHead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mHead b{font-size:15px}
.mHead .x{margin-left:auto;color:var(--dim);font-size:16px;padding:2px 8px;border-radius:7px}
.mHead .x:hover{color:var(--rd);background:rgba(248,113,113,.1)}
.mBody{padding:16px 18px;max-height:65vh;overflow-y:auto}
.mFoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.frow.one{grid-template-columns:1fr}
.fld label{display:block;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%}
.fld textarea{min-height:74px;resize:vertical;font-family:var(--mono);font-size:11.5px}

/* ---------- print / PDF sprint report ---------- */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#111}
  #app,#toasts,#loader,#modalRoot{display:none!important}
  #printRoot{display:block;font:12px/1.55 Georgia,'Times New Roman',serif;color:#111}
  #printRoot h1{font-size:20px;margin:0 0 2px}
  .rp-head{display:flex;gap:12px;align-items:center;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:14px}
  .rp-brand{font:700 13px/1 Verdana,sans-serif;letter-spacing:2px;border:2px solid #111;padding:6px 8px;border-radius:6px;white-space:nowrap}
  .rp-sub{color:#444;font-size:11px}
  .rp-card{margin-bottom:16px;page-break-inside:avoid}
  .rp-card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #999;padding-bottom:3px;margin:0 0 8px;font-family:Verdana,sans-serif}
  .rp-card h3{font-size:11px;margin:10px 0 4px;font-family:Verdana,sans-serif}
  table.rp-tb{width:100%;border-collapse:collapse;font-size:10.5px;font-family:Verdana,sans-serif}
  table.rp-tb th{background:#eee;border:1px solid #999;padding:4px 6px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
  table.rp-tb td{border:1px solid #aaa;padding:4px 6px}
  table.rp-kv{width:100%;border-collapse:collapse;font-size:11px}
  table.rp-kv th{width:150px;text-align:left;padding:3px 6px;background:#f2f2f2;border:1px solid #aaa;vertical-align:top;font-size:10px;text-transform:uppercase}
  table.rp-kv td{border:1px solid #aaa;padding:3px 6px}
  .rp-goal{margin:0 0 6px}
  .rp-img{width:100%;max-width:720px;border:1px solid #bbb;border-radius:6px;margin-top:4px}
  .rp-ul{margin:0;padding-left:18px}
  .rp-ul li{margin:2px 0}
  .mut{color:#666;font-style:italic}
  .rp-foot{margin-top:18px;border-top:1px solid #999;padding-top:6px;color:#555;font-size:10px}
}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:rgba(10,20,38,.96);border:1px solid var(--line2);border-left:3px solid var(--cy);border-radius:9px;
  padding:9px 15px;font-size:12px;animation:tin .25s;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:380px}
.toast.g{border-left-color:var(--gr)} .toast.a{border-left-color:var(--am)} .toast.r{border-left-color:var(--rd)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;background:#040910;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#loader .lg{font-size:24px;letter-spacing:4px;font-weight:700}
#loader .lg b{color:var(--cy)}
#loader .sb{font-size:10px;color:var(--dim);letter-spacing:3px;text-transform:uppercase}
#ldBarW{width:320px;height:3px;background:#12233c;border-radius:2px;overflow:hidden}
#ldBar{height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--vi));transition:width .3s}
#ldLog{width:360px;height:92px;overflow:hidden;font-family:var(--mono);font-size:10px;color:#5f7a9d;line-height:1.6}
#ldLog .ok{color:var(--gr)}

@media(max-width:900px){
  #side{width:58px}
  #side .lbl,#logo div:last-child,#sprintChip,#btnReset{display:none}
  #main{margin-left:58px;padding:14px}
  #logo{justify-content:center;padding:14px 8px}
  .navitem{justify-content:center}
}
</style>
</head>
<body>

<div id="loader">
  <div class="lg">SCRUM<b>FORGE</b></div>
  <div class="sb">Scrum Delivery Platform · v1.1</div>
  <div id="ldBarW"><div id="ldBar"></div></div>
  <div id="ldLog"></div>
</div>

<div id="app">
  <aside id="side">
    <div id="logo">
      <div class="mark">⚒</div>

/* =====================================================================
   STATE
===================================================================== */

const LS_KEY='scrumforge.v1';
let DB=null;

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ DB=JSON.parse(raw); return; }
  }catch(e){}
  DB=seedData(); save();
}
function resetDemo(){
  localStorage.removeItem(LS_KEY);
  DB=seedData(); save();
  toast('Demo data restored to seed','g');
  renderAll();
}

/* ---------------- helpers ---------------- */

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const DAY=86400000;
function d2t(s){ return Math.floor(new Date(s+'T00:00:00Z').getTime()/DAY); }
function fmtD(iso){ if(!iso) return '—'; return new Date(iso+'T00:00:00Z').toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function pinDayNum(){ if(!DB.pinDay) DB.pinDay=todayISO(); return d2t(DB.pinDay); }
function sprintLen(sp){ return Math.max(1, (d2t(sp.end)-d2t(sp.start))+1); }
function daysLeft(sp){ return Math.max(0, d2t(sp.end)-pinDayNum()+1); }
function dayIdx(sp){ return Math.min(Math.max(pinDayNum()-d2t(sp.start)+1,0), sprintLen(sp)); }

const COLS=[
  {id:'backlog', nm:'Backlog',     icon:'·'},
  {id:'todo',    nm:'To Do',       icon:'→'},
  {id:'wip',     nm:'In Progress', icon:'⚡'},
  {id:'review',  nm:'Review',      icon:'◈'},
  {id:'done',    nm:'Done',        icon:'✓'}
];
const WIP_LIMIT=4;
const PTS=[1,2,3,5,8,13];
const MOSCOW={M:'Must',S:'Should',C:'Could',W:'Won\u2019t'};

const userById = id => TEAM_SEED.find(u=>u.id===id) || {name:'Unassigned',initials:'?',color:'#7e93b6'};
const epicById = id => EPICS.find(e=>e.id===id) || {name:id,color:'#7e93b6'};
const sprintByN = n => DB.sprints.find(s=>s.n===n);
const activeSprint = () => DB.sprints.find(s=>s.status==='active');
const storyById = id => DB.stories.find(x=>x.id===id);
const sprintStories = n => DB.stories.filter(s=>s.sprint===n);
const doneSprints = () => DB.sprints.filter(s=>s.status==='done');
function sprintPoints(n){ return sprintStories(n).reduce((a,s)=>a+s.points,0); }
function donePoints(n){ return sprintStories(n).filter(s=>s.status==='done').reduce((a,s)=>a+s.points,0); }
function colPoints(n,st){ return sprintStories(n).filter(s=>s.status===st).reduce((a,s)=>a+s.points,0); }
function avgVelocity(){ const ds=doneSprints(); return ds.length? Math.round(ds.reduce((a,s)=>a+s.completed,0)/ds.length*10)/10 : 0; }
function committedOf(sp){ return sp.committed || sprintPoints(sp.n); }
function backlogOpenPoints(){ return DB.stories.filter(s=>!s.sprint || s.status!=='done').reduce((a,s)=>a+s.points,0); }

function toast(msg,kind){
  const box=$('#toasts'); if(!box) return;
  const el=document.createElement('div');
  el.className='toast'+(kind?' '+kind:'');
  el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),320); },2600);
}

function openModal(html){ const r=$('#modalRoot'); r.innerHTML='<div class="modal">'+html+'</div>'; r.classList.add('on'); }
function closeModal(){ const r=$('#modalRoot'); r.classList.remove('on'); r.innerHTML=''; }

/* =====================================================================
   RENDER
===================================================================== */

const NAV=[
  {id:'dash',    ic:'◱', lbl:'Dashboard'},
  {id:'backlog', ic:'≡', lbl:'Product Backlog'},
  {id:'board',   ic:'▤', lbl:'Sprint Board'},
  {id:'sprints', ic:'↻', lbl:'Sprints'},
  {id:'reports', ic:'◔', lbl:'Reports'},
  {id:'team',    ic:'☺', lbl:'Team'},
  {id:'cer',     ic:'✦', lbl:'Ceremonies'},
  {id:'about',   ic:'★', lbl:'About this App'}
];
let VIEW='dash';

function buildNav(){
  $('#nav').innerHTML = NAV.map(n=>
    '<button class="navitem'+(n.id===VIEW?' on':'')+'" data-v="'+n.id+'"><span class="ic">'+n.ic+'</span><span class="lbl">'+n.lbl+'</span></button>'
  ).join('');
  $$('#nav .navitem').forEach(b=>b.onclick=()=>go(b.dataset.v));
}

function go(v){
  VIEW=v;
  $$('#nav .navitem').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  renderAll();
  window.scrollTo({top:0});
}

function head(title,sub,acts){
  $('#vTitle').textContent=title;
  $('#vSub').textContent=sub||'';
  $('#vActs').innerHTML=(acts||'').map(a=>
    '<button class="abtn '+(a.cls||'')+'" onclick="'+a.fn+'">'+(a.ic||'')+' '+a.lbl+'</button>'
  ).join('');
}

function renderAll(){
  renderSprintChip();
  const R={dash:vDash, backlog:vBacklog, board:vBoard, sprints:vSprints, reports:vReports, team:vTeam, cer:vCeremonies, about:vAbout};
  $$('.pane').forEach(p=>p.classList.remove('on'));
  const pane=$('#v-'+VIEW); if(pane) pane.classList.add('on');
  (R[VIEW]||vDash)();
}

function renderSprintChip(){
  const sp=activeSprint();
  const el=$('#sprintChip');
  if(!sp){ el.innerHTML='<b>No active sprint</b><div class="row">Start one in Sprints</div>'; return; }
  el.innerHTML='<b>'+esc(sp.name)+'</b>'+
    '<div class="row"><span>Day '+dayIdx(sp)+'/'+sprintLen(sp)+'</span><span>'+daysLeft(sp)+'d left</span></div>'+
    '<div class="row"><span>Done '+donePoints(sp.n)+'/'+committedOf(sp)+' pts</span></div>';
}

/* ---------------- dashboard ---------------- */

function vDash(){
  head('Dashboard','Live state of the product — ScrumForge building ScrumForge',[
    {lbl:'New story', ic:'＋', fn:'newStoryModal()', cls:'pri'},
    {lbl:'Open board', ic:'▤', fn:"go('board')"}
  ]);
  const sp=activeSprint();
  const committed=sp?committedOf(sp):0;
  const done=sp?donePoints(sp.n):0;
  const pct=committed?Math.round(done/committed*100):0;
  const wip=sprintStories(sp?sp.n:0).filter(s=>s.status==='wip').length;
  const ds=doneSprints();

  $('#v-dash').innerHTML=
    '<div class="kgrid">'+
      kpi(ds.length?avgVelocity():0,'pts','Avg velocity','g')+
      kpi(daysLeft(sp),'days','Sprint days left', sp&&daysLeft(sp)<=2?'a':'')+
      kpi(committed,'pts','Committed','b')+
      kpi(done,'pts','Done','g')+
      kpi(pct+'%','','Sprint complete','v')+
      kpi(wip+'/'+WIP_LIMIT,'','WIP (In Progress)', wip>WIP_LIMIT?'r':'')+
      kpi(TEAM_SEED.length,'people','Team size','')+
      kpi(backlogOpenPoints(),'pts','Open backlog','a')+
    '</div>'+
    '<div class="g2" style="margin-top:12px">'+
      '<div class="card"><div class="ct"><span>Active sprint</span><b>'+(sp?esc(sp.name):'none')+'</b></div>'+
        (sp?
          '<div style="font-size:12.5px;color:var(--dim);margin-bottom:8px">🎯 '+esc(sp.goal)+'</div>'+
          '<div class="wl"><span>'+fmtD(sp.start)+' → '+fmtD(sp.end)+'</span><span>'+done+' / '+committed+' pts</span></div>'+
          '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
          '<div style="display:flex;gap:7px;margin-top:11px">'+
            '<button class="abtn" onclick="go(\'board\')">▤ Sprint board</button>'+
            '<button class="abtn" onclick="go(\'reports\')">◔ Burndown</button>'+
            '<button class="abtn" onclick="go(\'cer\')">✦ Ceremonies</button>'+
          '</div>'
        :'<div style="color:var(--dim)">No active sprint — start one from the Sprints view.</div>')+
      '</div>'+
      '<div class="card"><div class="ct"><span>Burndown · '+(sp?esc(sp.name):'—')+'</span><b>ideal vs remaining</b></div>'+
        '<canvas id="cBurnMini" class="chart" height="170"></canvas></div>'+
    '</div>'+
    '<div class="g2">'+
      '<div class="card"><div class="ct"><span>Velocity per sprint</span><b>committed vs completed</b></div>'+
        '<canvas id="cVelMini" class="chart" height="170"></canvas></div>'+
      '<div class="card"><div class="ct"><span>Latest ceremonies</span><button class="mbtn" onclick="go(\'cer\')">view all</button></div>'+
        '<div class="feed">'+DB.ceremonies.slice(-4).reverse().map(cerItem).join('')+'</div></div>'+
    '</div>'+
    '<div class="card" style="border-color:rgba(167,139,250,.4)"><div class="ct"><span>🐕 Dogfooding</span><b>this app manages its own build</b></div>'+
      '<div style="font-size:12.5px;color:var(--dim)">Every backlog item, sprint and ceremony you see here is the real history of building ScrumForge itself — '+ds.length+' completed sprints, '+ds.reduce((a,s)=>a+s.completed,0)+' points delivered, velocity trending up. Open <b>About this App</b> for the full story.</div></div>';

  if(sp) lineChart($('#cBurnMini'), burnSeries(sp.n), {today:dayIdx(sp)-1});
  else   blankChart($('#cBurnMini'));
  barChart($('#cVelMini'), velSeries());
}

function kpi(v,unit,lbl,cls){
  return '<div class="kpi '+(cls||'')+'"><div class="v">'+v+'<small>'+(unit||'')+'</small></div><div class="l">'+lbl+'</div></div>';
}
function cerItem(c){
  const col=c.type==='Retro'?'a':(c.type==='Review'?'g':(c.type==='Daily'?'c':'v'));
  return '<div class="fitem"><span class="t">'+esc(c.day)+'</span><span class="m"><span class="tag '+col+'">'+esc(c.type)+' · S'+c.sprint+'</span> '+esc(c.note)+'</span></div>';
}
function blankChart(cv){ const x=cv.getContext('2d'); x.fillStyle='rgba(126,147,182,.5)'; x.font='11px monospace'; x.fillText('no active sprint', 20, 60); }

/* ---------------- backlog ---------------- */

function vBacklog(){
  head('Product Backlog','Ordered by value · grouped by epic · '+DB.stories.length+' stories',[
    {lbl:'New story', ic:'＋', fn:'newStoryModal()', cls:'pri'}
  ]);
  $('#v-backlog').innerHTML=
    '<div id="bkTools">'+
      '<input type="search" id="bkQ" placeholder="🔍 Search stories…" value="'+esc(bkQ||'')+'">'+
      '<select id="bkEpic"><option value="">All epics</option>'+EPICS.map(e=>'<option value="'+e.id+'"'+(bkEpic===e.id?' selected':'')+'>'+esc(e.name)+'</option>').join('')+'</select>'+
      '<select id="bkPri"><option value="">All priorities</option>'+Object.keys(MOSCOW).map(k=>'<option value="'+k+'"'+(bkPri===k?' selected':'')+'>'+k+' · '+MOSCOW[k]+'</option>').join('')+'</select>'+
    '</div><div id="bkList"></div>';
  renderBacklogList();
  $('#bkQ').oninput=e=>{ bkQ=e.target.value; renderBacklogList(); };
  $('#bkEpic').onchange=e=>{ bkEpic=e.target.value; renderBacklogList(); };
  $('#bkPri').onchange=e=>{ bkPri=e.target.value; renderBacklogList(); };
}
let bkQ='', bkEpic='', bkPri='';

function renderBacklogList(){
  const q=bkQ.trim().toLowerCase();

/* =====================================================================
   CHARTS (canvas, no libraries)
===================================================================== */

function prepCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||600, h=cv.height;
  cv.width=w*dpr; cv.style.height=h+'px'; cv.height=h*dpr;
  const x=cv.getContext('2d'); x.scale(dpr,dpr);
  return {x,w,h};
}

function burnSeries(n){
  const sp=sprintByN(n); if(!sp) return [];
  const total=committedOf(sp), len=sprintLen(sp);
  const done=sprintStories(n).filter(s=>s.status==='done');
  const per=done.length?len/(done.length+1):0;
  const compDay=done.map((s,i)=>Math.max(1,Math.round((i+1)*per)));
  const today=sp.status==='active'?dayIdx(sp)-1:len-1;
  const out=[];
  for(let d=0; d<=Math.max(today,0); d++){
    let rem=total;
    compDay.forEach((cd,i)=>{ if(cd<=d) rem-=done[i].points; });
    out.push(Math.max(0,rem));
  }
  return out;
}

function velSeries(){
  return doneSprints().map(s=>({label:'S'+s.n, committed:committedOf(s), completed:s.completed}));
}

function lineChart(cv, series, opts){
  if(!cv) return;
  const {x,w,h}=prepCanvas(cv);
  const o=opts||{};
  x.clearRect(0,0,w,h);
  const pad={l:34,r:12,t:12,b:22};
  const data=series.slice();
  const idealLen=data.length;
  if(!data.length){ x.fillStyle='rgba(126,147,182,.5)'; x.font='11px monospace'; x.fillText('no data yet',pad.l,40); return; }
  const max=Math.max(1,...data);
  const X=i=>pad.l+(idealLen<=1?0:(w-pad.l-pad.r)*(i/(idealLen-1)));
  const Y=v=>h-pad.b-(h-pad.t-pad.b)*(v/max);
  x.strokeStyle='rgba(56,189,248,.14)'; x.fillStyle='rgba(126,147,182,.9)'; x.font='9px monospace';
  for(let g=0;g<=4;g++){
    const vy=pad.t+(h-pad.t-pad.b)*g/4;
    x.beginPath(); x.moveTo(pad.l,vy); x.lineTo(w-pad.r,vy); x.stroke();
    x.fillText(String(Math.round(max*(1-g/4))), 6, vy+3);
  }
  x.beginPath();
  for(let i=0;i<idealLen;i++){ const px=X(i),py=Y(max*(1-i/Math.max(idealLen-1,1))); i?x.lineTo(px,py):x.moveTo(px,py); }
  x.setLineDash([4,4]); x.strokeStyle='rgba(126,147,182,.6)'; x.stroke(); x.setLineDash([]);
  x.beginPath();
  data.forEach((v,i)=>{ i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)); });
  x.strokeStyle='#22d3ee'; x.lineWidth=2; x.stroke();
  x.lineTo(X(data.length-1),h-pad.b); x.lineTo(X(0),h-pad.b); x.closePath();
  x.fillStyle='rgba(34,211,238,.08)'; x.fill();
  data.forEach((v,i)=>{ x.beginPath(); x.arc(X(i),Y(v),2.4,0,7); x.fillStyle='#22d3ee'; x.fill(); });
  if(o.today!=null && o.today>=0 && o.today<idealLen){
    x.setLineDash([3,3]); x.strokeStyle='rgba(251,191,36,.7)';
    x.beginPath(); x.moveTo(X(o.today),pad.t); x.lineTo(X(o.today),h-pad.b); x.stroke(); x.setLineDash([]);
    x.fillStyle='#fbbf24'; x.font='9px monospace'; x.fillText('today', X(o.today)-14, pad.t+8);
  }
  x.fillStyle='rgba(126,147,182,.8)';
  for(let i=0;i<idealLen;i+=Math.ceil(idealLen/8)||1) x.fillText(String(i+1), X(i)-3, h-8);
}

function barChart(cv, groups){
  if(!cv) return;
  const {x,w,h}=prepCanvas(cv);
  x.clearRect(0,0,w,h);
  const pad={l:34,r:12,t:14,b:22};
  if(!groups.length){ x.fillStyle='rgba(126,147,182,.5)'; x.font='11px monospace'; x.fillText('no completed sprints yet',pad.l,40); return; }
  const max=Math.max(1,...groups.map(g=>Math.max(g.committed,g.completed)));
  const bw=(w-pad.l-pad.r)/groups.length;
  x.strokeStyle='rgba(56,189,248,.14)'; x.fillStyle='rgba(126,147,182,.9)'; x.font='9px monospace';
  for(let g=0;g<=4;g++){
    const vy=pad.t+(h-pad.t-pad.b)*g/4;
    x.beginPath(); x.moveTo(pad.l,vy); x.lineTo(w-pad.r,vy); x.stroke();
    x.fillText(String(Math.round(max*(1-g/4))), 6, vy+3);
  }
  groups.forEach((g,i)=>{
    const cx=pad.l+bw*i;
    const b1w=Math.min(16,bw*0.28);
    const h1=(h-pad.t-pad.b)*(g.committed/max);
    const h2=(h-pad.t-pad.b)*(g.completed/max);
    x.fillStyle='rgba(96,165,250,.55)'; x.fillRect(cx+bw*0.22-b1w, h-pad.b-h1, b1w, h1);
    x.fillStyle='#34d399';             x.fillRect(cx+bw*0.55,     h-pad.b-h2, b1w, h2);
    x.fillStyle='rgba(126,147,182,.9)';
    x.fillText(g.label, cx+bw/2-8, h-8);
    if(g.completed>g.committed){} // (over-delivery would render same)
  });
  const avg=groups.reduce((a,g)=>a+g.completed,0)/groups.length;
  const ay=h-pad.b-(h-pad.t-pad.b)*(avg/max);
  x.setLineDash([4,4]); x.strokeStyle='rgba(52,211,153,.8)';
  x.beginPath(); x.moveTo(pad.l,ay); x.lineTo(w-pad.r,ay); x.stroke(); x.setLineDash([]);
  x.fillStyle='rgba(52,211,153,.95)'; x.fillText('avg '+avg.toFixed(1), w-58, ay-4);
}

    '<div class="mFoot"><button class="abtn dng" onclick="deleteStory(\''+esc(s.id)+'\')">🗑 Delete</button>'+
    '<button class="abtn" onclick="closeModal()">Cancel</button>'+
    '<button class="abtn pri" onclick="saveStory(\''+esc(s.id)+'\')">💾 Save</button></div>');
}

function storyForm(s){
  return '<div class="frow one"><div class="fld"><label>Title (user story)</label><input id="fTitle" value="'+esc(s.title)+'" placeholder="As a … I want … so that …"></div></div>'+
    '<div class="frow">'+
      '<div class="fld"><label>Epic</label><select id="fEpic">'+EPICS.map(e=>'<option value="'+e.id+'"'+(s.epic===e.id?' selected':'')+'>'+esc(e.name)+'</option>').join('')+'</select></div>'+
      '<div class="fld"><label>Story points</label><select id="fPts">'+PTS.map(p=>'<option'+(s.points===p?' selected':'')+'>'+p+'</option>').join('')+'</select></div>'+
    '</div>'+
    '<div class="frow">'+
      '<div class="fld"><label>Assignee</label><select id="fAsg">'+TEAM_SEED.map(u=>'<option value="'+u.id+'"'+(s.assignee===u.id?' selected':'')+'>'+esc(u.name)+' — '+esc(u.role)+'</option>').join('')+'</select></div>'+
      '<div class="fld"><label>Priority (MoSCoW)</label><select id="fPri">'+Object.keys(MOSCOW).map(k=>'<option value="'+k+'"'+(s.priority===k?' selected':'')+'>'+k+' · '+MOSCOW[k]+'</option>').join('')+'</select></div>'+
    '</div>'+
    '<div class="frow">'+
      '<div class="fld"><label>Status</label><select id="fSt">'+COLS.map(c=>'<option value="'+c.id+'"'+(s.status===c.id?' selected':'')+'>'+c.nm+'</option>').join('')+'</select></div>'+
      '<div class="fld"><label>Sprint</label><select id="fSp"><option value="">(backlog — unscheduled)</option>'+DB.sprints.map(x=>'<option value="'+x.n+'"'+(s.sprint===x.n?' selected':'')+'>S'+x.n+' · '+esc(x.name)+'</option>').join('')+'</select></div>'+
    '</div>'+
    '<div class="frow one"><div class="fld"><label>Acceptance criteria (one per line)</label><textarea id="fCrit" placeholder="Given / when / then…">'+esc(s.criteria||'')+'</textarea></div></div>';
}

function saveStory(id){
  const title=$('#fTitle').value.trim();
  if(!title){ toast('Title is required','a'); return; }
  const data={
    title:title,
    epic:$('#fEpic').value,
    points:parseInt($('#fPts').value,10)||3,
    assignee:$('#fAsg').value,
    priority:$('#fPri').value,
    status:$('#fSt').value,
    sprint:$('#fSp').value?parseInt($('#fSp').value,10):null,
    criteria:$('#fCrit').value.trim()
  };
  if(id){
    Object.assign(storyById(id),data);
    toast(id+' updated','g');
  }else{
    DB.stories.push(Object.assign({id:nextStoryId()},data));
    toast('Story created','g');
  }
  save(); closeModal(); renderAll();
}

function deleteStory(id){
  const s=storyById(id); if(!s) return;
  if(!confirm('Delete '+id+' — "'+s.title+'"?')) return;
  DB.stories=DB.stories.filter(x=>x.id!==id);
  save(); closeModal(); renderAll(); toast(id+' deleted','r');
}

function setStatus(id,status){
  const s=storyById(id); if(!s) return;
  if(s.status===status) return;
  s.status=status;
  save(); renderAll();
  toast(id+' → '+colName(status), status==='done'?'g':'');
}

function moveStory(id,dir){
  const epic=DB.stories.filter(s=>s.epic===storyById(id).epic);
  const i=epic.findIndex(s=>s.id===id);
  const j=dir==='up'?i-1:i+1;
  if(j<0||j>=epic.length) return;
  const gi=DB.stories.indexOf(epic[i]), gj=DB.stories.indexOf(epic[j]);
  const tmp=DB.stories[gi]; DB.stories[gi]=DB.stories[gj]; DB.stories[gj]=tmp;
  save(); renderAll();
}

function newSprintModal(){
  openModal(
    '<div class="mHead"><b>＋ New sprint</b><button class="x" onclick="closeModal()">✕</button></div>'+
    '<div class="mBody">'+sprintForm({name:'',goal:'',start:DB.pinDay||todayISO(),end:''})+'</div>'+
    '<div class="mFoot"><button class="abtn" onclick="closeModal()">Cancel</button>'+
    '<button class="abtn pri" onclick="saveSprint(null)">💾 Create sprint</button></div>');
}

function editSprintModal(n){
  const sp=sprintByN(n); if(!sp) return;
  openModal(
    '<div class="mHead"><b>✎ '+esc(sp.name)+'</b><button class="x" onclick="closeModal()">✕</button></div>'+
    '<div class="mBody">'+sprintForm(sp)+'</div>'+
    '<div class="mFoot"><button class="abtn" onclick="closeModal()">Cancel</button>'+
    '<button class="abtn pri" onclick="saveSprint('+n+')">💾 Save</button></div>');
}

function sprintForm(sp){
  return '<div class="frow one"><div class="fld"><label>Sprint name</label><input id="sName" value="'+esc(sp.name||'')+'" placeholder="Sprint 8 · Big Things"></div></div>'+
    '<div class="frow one"><div class="fld"><label>Sprint goal (required to start)</label><input id="sGoal" value="'+esc(sp.goal||'')+'" placeholder="Why is this sprint valuable?"></div></div>'+
    '<div class="frow">'+
      '<div class="fld"><label>Start date</label><input id="sStart" type="date" value="'+esc(sp.start||'')+'"></div>'+
      '<div class="fld"><label>End date</label><input id="sEnd" type="date" value="'+esc(sp.end||'')+'"></div>'+
    '</div>';
}

function saveSprint(n){
  const name=$('#sName').value.trim(), goal=$('#sGoal').value.trim();
  const start=$('#sStart').value, end=$('#sEnd').value;
  if(!name||!start||!end){ toast('Name, start and end are required','a'); return; }
  if(d2t(end)<d2t(start)){ toast('End date must be after start','a'); return; }
  if(n){
    Object.assign(sprintByN(n),{name,goal,start,end});
    toast('Sprint updated','g');
  }else{
    const next=Math.max(0,...DB.sprints.map(s=>s.n))+1;
    DB.sprints.push({n:next,name,goal,start,end,status:'planned',committed:0,completed:0});
    toast('Sprint created — plan stories into it','g');
  }
  save(); closeModal(); renderAll();
}

function startSprint(n){
  const sp=sprintByN(n); if(!sp) return;
  if(activeSprint()){ toast('Close the active sprint first','a'); return; }
  if(!sp.goal){ toast('A sprint goal is required to start','a'); return; }
  const pts=sprintPoints(n);
  if(!pts){ toast('Plan at least one story into this sprint','a'); return; }
  sp.status='active';
  sp.committed=pts;
  save(); renderAll();
  toast(sp.name+' started — '+pts+' pts committed 🚀','g');
}

function closeSprint(n){
  const sp=sprintByN(n); if(!sp) return;
  const spilled=sprintStories(n).filter(s=>s.status!=='done');
  const spillPts=spilled.reduce((a,s)=>a+s.points,0);
  if(!confirm('Close '+sp.name+'?\n\nCompleted: '+donePoints(n)+' pts\nSpilled back to backlog: '+spilled.length+' stories ('+spillPts+' pts)\n\nSpilled stories return to the Product Backlog for re-planning.')) return;
  spilled.forEach(s=>{ s.sprint=null; });
  sp.status='done';
  sp.completed=donePoints(n);
  save(); renderAll();
  toast(sp.name+' closed · '+sp.completed+' pts delivered'+(spillPts?' · '+spillPts+' pts spilled':''),'g');
}

function deleteSprint(n){
  const sp=sprintByN(n); if(!sp) return;
  if(sp.status==='active'){ toast('Close the sprint before deleting','a'); return; }
  if(!confirm('Delete '+sp.name+'? Its stories return to the backlog.')) return;
  sprintStories(n).forEach(s=>{ s.sprint=null; });
  DB.sprints=DB.sprints.filter(s=>s.n!==n);
  save(); renderAll(); toast('Sprint deleted','r');
}

/* =====================================================================
   EXPORT — CSV dataset & printable sprint report (hand-in artifacts)
===================================================================== */

function csvCell(v){
  v=String(v==null?'':v);
  if(/[",\n\r]/.test(v)) v='"'+v.replace(/"/g,'""')+'"';
  return v;
}

function exportCSV(){
  const L=[];
  L.push('SPRINT SUMMARY');
  L.push(['Sprint','Name','Status','Start','End','Committed','Completed','Spilled','Success %'].map(csvCell).join(','));
  DB.sprints.forEach(sp=>{
    const c=committedOf(sp), d=sp.status==='done'?sp.completed:donePoints(sp.n);
    L.push([sp.n,sp.name,sp.status,sp.start,sp.end,c,d,c-d,(c?Math.round(d/c*100):0)+'%'].map(csvCell).join(','));
  });
  L.push('');
  L.push('STORIES');
  L.push(['ID','Title','Epic','Points','Priority','Assignee','Status','Sprint'].map(csvCell).join(','));
  DB.stories.forEach(s=>{
    L.push([s.id,s.title,epicById(s.epic).name,s.points,s.priority,userById(s.assignee).name,colName(s.status),s.sprint?('S'+s.sprint):''].map(csvCell).join(','));
  });
  const blob=new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='scrumforge-report-'+(DB.pinDay||todayISO())+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('CSV report downloaded','g');
}

/* Renders a chart into an offscreen canvas and returns a PNG data-URL
   (images print reliably; raw canvases often do not). */
function chartImage(w,h,drawFn){
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-9999px;top:0;width:'+w+'px;';
  const cv=document.createElement('canvas');
  cv.height=h; cv.style.width=w+'px';
  host.appendChild(cv); document.body.appendChild(host);
  const x=cv.getContext('2d');
  x.fillStyle='#0b1526'; x.fillRect(0,0,w,h);
  drawFn(cv);
  const url=cv.toDataURL('image/png');
  host.remove();
  return url;
}

function buildReportHTML(n){
  const sp=sprintByN(n)||activeSprint()||doneSprints().slice(-1)[0]||DB.sprints[0];
  const ds=doneSprints();
  const burnImg=chartImage(860,300,cv=>lineChart(cv,burnSeries(sp.n),{today: sp.status==='active'?dayIdx(sp)-1:null}));
  const velImg=chartImage(860,300,cv=>barChart(cv,velSeries()));
  const stories=sprintStories(sp.n);
  const c=committedOf(sp), d=sp.status==='done'?sp.completed:donePoints(sp.n);
  const cers=DB.ceremonies.filter(x=>x.sprint===sp.n);
  const cer=cers.length
    ? cers.map(x=>'<tr><td>'+esc(x.day)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.note)+'</td></tr>').join('')
    : '<tr><td colspan="3" class="mut">No ceremonies logged for this sprint.</td></tr>';
  const DoD=['Acceptance criteria met','Code reviewed (pair or peer)','Tests pass','No regressions','Demoed at Sprint Review','Docs updated'];

  return '<div class="rp-head"><div class="rp-brand">⚒ SCRUMFORGE</div><div><h1>Sprint Report</h1>'+
    '<div class="rp-sub">ScrumForge — a Scrum delivery platform, built with Scrum · generated '+fmtD(DB.pinDay||todayISO())+'</div></div></div>'+

    '<div class="rp-card"><h2>1 · Product summary</h2><table class="rp-kv">'+
    '<tr><th>Product vision</th><td>For agile teams who need lightweight, honest delivery tooling, ScrumForge is a Scrum platform managing backlogs, sprints and ceremonies with zero setup — demonstrating the very process it supports.</td></tr>'+
    '<tr><th>Team</th><td>'+TEAM_SEED.map(u=>esc(u.name)+' ('+esc(u.role)+')').join(' · ')+'</td></tr>'+
    '<tr><th>Delivery record</th><td>'+ds.length+' sprints completed · average velocity '+avgVelocity()+' pts · '+ds.reduce((a,s)=>a+s.completed,0)+' points delivered · '+DB.stories.length+' stories managed</td></tr>'+
    '</table></div>'+

    '<div class="rp-card"><h2>2 · Sprint summary</h2><table class="rp-tb">'+
    '<tr><th>Sprint</th><th>Goal</th><th>Dates</th><th>Status</th><th>Committed</th><th>Completed</th><th>Spill</th><th>Success</th></tr>'+
    DB.sprints.map(s=>{const cc=committedOf(s), dd=s.status==='done'?s.completed:donePoints(s.n);
      return '<tr><td>S'+s.n+'</td><td>'+esc(s.goal)+'</td><td>'+fmtD(s.start)+' → '+fmtD(s.end)+'</td><td>'+s.status+'</td><td>'+cc+'</td><td>'+dd+'</td><td>'+(cc-dd)+'</td><td>'+(cc?Math.round(dd/cc*100):0)+'%</td></tr>';}).join('')+
    '</table></div>'+

    '<div class="rp-card"><h2>3 · Sprint in focus — '+esc(sp.name)+'</h2>'+
    '<p class="rp-goal"><b>Sprint goal:</b> '+esc(sp.goal)+'</p>'+
    '<p>'+fmtD(sp.start)+' → '+fmtD(sp.end)+' · status: '+sp.status+' · commitment: '+d+' / '+c+' pts ('+(c?Math.round(d/c*100):0)+'%)</p>'+
    (stories.length
      ? '<table class="rp-tb"><tr><th>ID</th><th>Story</th><th>Epic</th><th>Pts</th><th>Assignee</th><th>Status</th></tr>'+
        stories.map(s=>'<tr><td>'+esc(s.id)+'</td><td>'+esc(s.title)+'</td><td>'+esc(epicById(s.epic).name)+'</td><td>'+s.points+'</td><td>'+esc(userById(s.assignee).name)+'</td><td>'+colName(s.status)+'</td></tr>').join('')+'</table>'
      : '<p class="mut">No stories planned in this sprint.</p>')+
    '<h3>Sprint burndown (ideal vs remaining)</h3><img class="rp-img" src="'+burnImg+'" alt="Sprint burndown chart">'+
    '</div>'+

    '<div class="rp-card"><h2>4 · Velocity across sprints</h2><img class="rp-img" src="'+velImg+'" alt="Velocity chart"></div>'+

    '<div class="rp-card"><h2>5 · Ceremonies — '+esc(sp.name)+'</h2><table class="rp-tb">'+
    '<tr><th>Day</th><th>Event</th><th>Notes</th></tr>'+cer+'</table></div>'+

    '<div class="rp-card"><h2>6 · Definition of Done</h2><ul class="rp-ul">'+DoD.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'+

    '<div class="rp-foot">Generated by ScrumForge v1.1 — Scrum applied to its own development · single-file app, no dependencies.</div>';
}

function printReport(){
  const sel=$('#repSprint');
  const n=sel?+sel.value:(activeSprint()||doneSprints().slice(-1)[0]||DB.sprints[0]).n;
  $('#printRoot').innerHTML=buildReportHTML(n);
  toast('Opening print dialog — choose Save as PDF','g');
  setTimeout(()=>window.print(),150);
}
window.addEventListener('afterprint',()=>{ const r=$('#printRoot'); if(r) r.innerHTML=''; });

   BOOT
===================================================================== */

function init(){
  load();
  buildNav();
  renderAll();

  $('#btnReset').onclick=()=>{ if(confirm('Reset all data back to the seeded demo dataset?')) resetDemo(); };
  $('#modalRoot').addEventListener('click',e=>{ if(e.target.id==='modalRoot') closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

  const steps=[
    ['loading seed dataset…',18],['mounting views…',38],['computing burndown…',58],
    ['crunching velocity…',76],['orchestrating scrum…',92],['ready',100]
  ];
  const log=$('#ldLog'), bar=$('#ldBar');
  steps.forEach((s,i)=>setTimeout(()=>{
    log.innerHTML+='<div class="ok">✓ '+s[0]+'</div>';
    bar.style.width=s[1]+'%';
    if(i===steps.length-1) setTimeout(()=>$('#loader').classList.add('done'),350);
  },120+i*160));

  window.addEventListener('resize',()=>{ if(VIEW==='dash'||VIEW==='reports') renderAll(); });
}

document.addEventListener('DOMContentLoaded',init);
